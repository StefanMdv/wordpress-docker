services:
  wordpress:
    image: bitnami/wordpress:6.4.3
    container_name: wordpress_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    env_file:
      - .env
    networks:
      - wordpress_network

  db:
    image: mysql:8.0
    container_name: wordpress_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network


networks:
  wordpress_network:

volumes:
  db_data: